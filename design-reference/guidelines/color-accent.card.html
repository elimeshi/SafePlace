<!-- @dsCard group="Colors" viewport="700x150" name="Accent — warm terracotta" subtitle="One touch of warmth, primary CTA only" -->
<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}
  .row{display:flex;border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-sm)}
  .sw{flex:1;height:96px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px}
  .n{font:var(--type-label);opacity:.95}
  .h{font-family:var(--font-numeric);font-size:11px;opacity:.8}
  .note{margin-top:10px;font:var(--type-meta);color:var(--text-secondary)}
</style></head><body>
<div class="row">
  <div class="sw" style="background:var(--terracotta-100);color:var(--terracotta-700)"><span class="n">100</span></div>
  <div class="sw" style="background:var(--terracotta-400);color:#fff"><span class="n">400</span></div>
  <div class="sw" style="background:var(--terracotta-500);color:#fff"><span class="n">500 · ACCENT</span><span class="h">#C97D4F</span></div>
  <div class="sw" style="background:var(--terracotta-600);color:#fff"><span class="n">600 · hover</span></div>
  <div class="sw" style="background:var(--terracotta-700);color:#fff"><span class="n">700 · active</span></div>
</div>
<div class="note">Used sparingly — reserved for the single most important CTA on a screen.</div>
</body></html>
