<!-- @dsCard group="Colors" viewport="700x150" name="Primary — deep soft blue" subtitle="The calm, restrained core color (master §6.3.5)" -->
<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}
  .row{display:flex;gap:0;border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-sm)}
  .sw{flex:1;height:96px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px}
  .n{font:var(--type-label);opacity:.9}
  .h{font-family:var(--font-numeric);font-size:11px;opacity:.75}
</style></head><body>
<div class="row">
  <div class="sw" style="background:var(--blue-050);color:var(--blue-800)"><span class="n">050</span></div>
  <div class="sw" style="background:var(--blue-100);color:var(--blue-800)"><span class="n">100</span></div>
  <div class="sw" style="background:var(--blue-200);color:var(--blue-800)"><span class="n">200</span></div>
  <div class="sw" style="background:var(--blue-400);color:#fff"><span class="n">400 · light</span></div>
  <div class="sw" style="background:var(--blue-600);color:#fff"><span class="n">600 · PRIMARY</span><span class="h">#2C5985</span></div>
  <div class="sw" style="background:var(--blue-800);color:#fff"><span class="n">800 · dark</span></div>
  <div class="sw" style="background:var(--blue-900);color:#fff"><span class="n">900</span></div>
</div>
</body></html>
