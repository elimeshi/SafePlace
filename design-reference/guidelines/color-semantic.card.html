<!-- @dsCard group="Colors" viewport="700x150" name="Semantic status" subtitle="Success · warning (dangerous-zone) · danger" -->
<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}
  .row{display:flex;gap:14px}
  .sw{flex:1;height:96px;border-radius:var(--radius-lg);display:flex;flex-direction:column;justify-content:flex-end;padding:12px;box-shadow:var(--shadow-sm)}
  .n{font:var(--type-body-strong)}
  .h{font-family:var(--font-numeric);font-size:11px;opacity:.85}
</style></head><body>
<div class="row">
  <div class="sw" style="background:var(--success-050);color:var(--success);border:1px solid var(--success)"><span class="n">הצלחה</span><span class="h">#2F855A success</span></div>
  <div class="sw" style="background:var(--warning-050);color:var(--warning);border:1px solid var(--warning)"><span class="n">אזהרה</span><span class="h">#B7791F warning</span></div>
  <div class="sw" style="background:var(--danger-050);color:var(--danger);border:1px solid var(--danger)"><span class="n">סכנה</span><span class="h">#C53030 danger</span></div>
</div>
</body></html>
