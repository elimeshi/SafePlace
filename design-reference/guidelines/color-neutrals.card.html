<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals — ink & surface" subtitle="Generous white; quiet greys for text & frames" -->
<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}
  .row{display:flex;border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-sm)}
  .sw{flex:1;height:96px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px}
  .n{font:var(--type-label)}
</style></head><body>
<div class="row">
  <div class="sw" style="background:var(--white);color:var(--ink-700);border:1px solid var(--ink-200)"><span class="n">white</span></div>
  <div class="sw" style="background:var(--ink-050);color:var(--ink-700)"><span class="n">050 · muted</span></div>
  <div class="sw" style="background:var(--ink-200);color:var(--ink-700)"><span class="n">200 · border</span></div>
  <div class="sw" style="background:var(--ink-400);color:#fff"><span class="n">400 · muted</span></div>
  <div class="sw" style="background:var(--ink-500);color:#fff"><span class="n">500 · secondary</span></div>
  <div class="sw" style="background:var(--ink-900);color:#fff"><span class="n">900 · primary</span></div>
</div>
</body></html>
