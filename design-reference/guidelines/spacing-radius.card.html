<!-- @dsCard group="Spacing" viewport="700x150" name="Radius & elevation" subtitle="Soft corners, restrained shadows" -->
<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:24px;background:var(--surface-page);font-family:var(--font-sans);display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap}
  .box{width:78px;height:60px;background:var(--white);border:1px solid var(--border-subtle);display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font:var(--type-label);color:var(--text-secondary)}
  .sh{width:96px;height:60px;background:var(--white);border-radius:var(--radius-lg);display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font:var(--type-label);color:var(--text-secondary)}
</style></head><body>
<div class="box" style="border-radius:var(--radius-sm)">sm · 6</div>
<div class="box" style="border-radius:var(--radius-md)">md · 10</div>
<div class="box" style="border-radius:var(--radius-lg)">lg · 16</div>
<div class="box" style="border-radius:var(--radius-xl)">xl · 22</div>
<div style="width:1px;height:60px;background:var(--border-subtle)"></div>
<div class="sh" style="box-shadow:var(--shadow-sm)">sm</div>
<div class="sh" style="box-shadow:var(--shadow-card)">card</div>
<div class="sh" style="box-shadow:var(--shadow-lg)">lg</div>
</body></html>
