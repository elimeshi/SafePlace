<!-- @dsCard group="Colors" viewport="700x160" name="Group palette" subtitle="12 muted colors for group identity & source labels" -->
<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}
  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
  .sw{height:52px;border-radius:var(--radius-md);display:flex;align-items:flex-end;padding:7px;color:#fff;font:var(--type-label)}
  .note{margin-top:12px;font:var(--type-meta);color:var(--text-secondary)}
</style></head><body>
<div class="grid">
  <div class="sw" style="background:var(--group-blue)">blue</div>
  <div class="sw" style="background:var(--group-sage)">sage</div>
  <div class="sw" style="background:var(--group-terra)">terra</div>
  <div class="sw" style="background:var(--group-plum)">plum</div>
  <div class="sw" style="background:var(--group-tan)">tan</div>
  <div class="sw" style="background:var(--group-teal)">teal</div>
  <div class="sw" style="background:var(--group-brick)">brick</div>
  <div class="sw" style="background:var(--group-slate)">slate</div>
  <div class="sw" style="background:var(--group-olive)">olive</div>
  <div class="sw" style="background:var(--group-indigo)">indigo</div>
  <div class="sw" style="background:var(--group-clay)">clay</div>
  <div class="sw" style="background:var(--group-forest)">forest</div>
</div>
<div class="note">Admin-picked per group. Source labels use a soft 16% tint of these — never full saturation.</div>
</body></html>
