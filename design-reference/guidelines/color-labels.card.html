<!-- @dsCard group="Colors" viewport="700x150" name="Feed source-label colors" subtitle="How post provenance reads at a glance" -->
<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:22px;background:var(--surface-page);font-family:var(--font-sans);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .lab{display:inline-flex;align-items:center;height:24px;padding:0 12px;border-radius:var(--radius-md);font:var(--type-label)}
  .grp{background:color-mix(in srgb,var(--group-sage) 16%,white);color:color-mix(in srgb,var(--group-sage) 78%,black)}
  .pub{background:color-mix(in srgb,var(--label-neutral) 18%,white);color:color-mix(in srgb,var(--label-neutral) 82%,black)}
  .sug{background:color-mix(in srgb,var(--label-suggested) 20%,white);color:color-mix(in srgb,var(--label-suggested) 80%,black)}
  .cap{width:100%;font:var(--type-meta);color:var(--text-secondary)}
</style></head><body>
<span class="lab grp">קבוצה · חסדי שכונה</span>
<span class="lab pub">פוסט ציבורי</span>
<span class="lab sug">מוצע עבורך</span>
<span class="cap">Group (colored) · public (slate) · suggested (amber). Immediate visual identification of every post's origin.</span>
</body></html>
