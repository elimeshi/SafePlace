<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:24px;background:var(--surface-page);display:flex;gap:40px;flex-wrap:wrap}
  .fam{display:flex;flex-direction:column;gap:6px}
  .big{font-size:32px;color:var(--text-primary)}
  .m{font:var(--type-label);color:var(--text-muted)}
  .num{font-family:var(--font-numeric);font-size:26px;color:var(--blue-700);font-feature-settings:'tnum' 1}
</style></head><body>
<div class="fam">
  <span class="big" style="font-family:'Rubik'">אבגד שלום Aa 123</span>
  <span class="m">Rubik — primary UI & display · 400/500/600/700</span>
</div>
<div class="fam">
  <span class="big" style="font-family:'Heebo'">אבגד שלום Aa 123</span>
  <span class="m">Heebo — companion & numerals · 400/500/700</span>
  <span class="num">1,240 עוקבים · 42 לייקים</span>
</div>
</body></html>
