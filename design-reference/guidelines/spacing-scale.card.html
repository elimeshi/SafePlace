<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing scale" subtitle="Generous whitespace — err toward the larger end" -->
<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:24px;background:var(--surface-page);font-family:var(--font-sans)}
  .row{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .bar{height:16px;background:var(--blue-400);border-radius:3px}
  .n{font:var(--type-label);color:var(--text-secondary);width:120px}
</style></head><body>
<div class="row"><span class="n">xs · 4</span><span class="bar" style="width:4px"></span></div>
<div class="row"><span class="n">sm · 8</span><span class="bar" style="width:8px"></span></div>
<div class="row"><span class="n">md · 12</span><span class="bar" style="width:12px"></span></div>
<div class="row"><span class="n">lg · 16</span><span class="bar" style="width:16px"></span></div>
<div class="row"><span class="n">xl · 24</span><span class="bar" style="width:24px"></span></div>
<div class="row"><span class="n">2xl · 32</span><span class="bar" style="width:32px"></span></div>
<div class="row"><span class="n">3xl · 48</span><span class="bar" style="width:48px"></span></div>
<div class="row"><span class="n">4xl · 64</span><span class="bar" style="width:64px"></span></div>
</body></html>
