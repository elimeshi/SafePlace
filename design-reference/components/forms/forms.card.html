<!-- @dsCard group="Components" viewport="700x300" name="Forms" subtitle="Buttons, fields, toggles, gender doors, consent" -->
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-page); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin-bottom: 22px; }
  .grp { display: flex; flex-direction: column; gap: 10px; }
  .cap { font: var(--type-label); color: var(--text-muted); letter-spacing: .04em; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Button, TextField, Toggle, GenderChoice, Checkbox } = window.SafePlaceDesignSystem_58efd0;
function Demo() {
  const [name, setName] = React.useState('שרה');
  const [gender, setGender] = React.useState('female');
  const [agree, setAgree] = React.useState(true);
  const [sugg, setSugg] = React.useState(true);
  return (
    <div>
      <div className="row">
        <div className="grp"><span className="cap">CTA · HALO</span><Button variant="cta" size="lg" halo>יצירת חשבון</Button></div>
        <div className="grp"><span className="cap">PRIMARY</span><Button>המשך</Button></div>
        <div className="grp"><span className="cap">SECONDARY</span><Button variant="secondary">כניסה</Button></div>
        <div className="grp"><span className="cap">GHOST</span><Button variant="ghost">ביטול</Button></div>
        <div className="grp"><span className="cap">DANGER</span><Button variant="danger">מחיקת חשבון</Button></div>
        <div className="grp"><span className="cap">DISABLED</span><Button disabled>פרסם</Button></div>
      </div>
      <div className="row" style={{ alignItems: 'flex-start' }}>
        <div style={{ width: 240 }}><TextField label="שם מלא" value={name} onChange={e => setName(e.target.value)} valid={name.length > 1} /></div>
        <div style={{ width: 240 }}><TextField label="אימייל או טלפון" /></div>
      </div>
      <div className="row" style={{ alignItems: 'flex-start' }}>
        <div style={{ width: 300 }}><GenderChoice value={gender} onChange={setGender} /></div>
        <div className="grp" style={{ gap: 16 }}>
          <Toggle readOnly checked label="אינך רואה תוכן הכולל נשים" />
          <Toggle checked={sugg} onChange={setSugg} label="הצג פוסטים מוצעים" description="גילוי קבוצות חדשות" />
        </div>
      </div>
      <div className="row">
        <Checkbox checked={agree} onChange={setAgree}>קראתי ואני מסכים ל<a href="#">תנאי השימוש</a> ול<a href="#">מדיניות הפרטיות</a></Checkbox>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
