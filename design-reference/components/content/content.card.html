<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-page); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin-bottom: 22px; }
  .cap { font: var(--type-label); color: var(--text-muted); width: 100%; margin-bottom: -6px; }
  .icons { display: flex; flex-wrap: wrap; gap: 14px; color: var(--blue-700); }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Avatar, SourceLabel, InteractionBar, Icon } = window.SafePlaceDesignSystem_58efd0;
const icons = ['home','search','bell','plus','heart','comment','share','bookmark','users','image','poll','map-pin','tag','shield-check','lock','eye','settings','more-horizontal'];
function Demo() {
  return (
    <div>
      <div className="row">
        <span className="cap">AVATARS · STATUS RING</span>
        <Avatar name="שרה ל." size={56} ring ringColor="var(--group-terra)" />
        <Avatar name="משפחת כהן" size={56} ring ringColor="var(--group-sage)" />
        <Avatar name="דוד" size={48} />
        <Avatar name="י" size={40} />
      </div>
      <div className="row">
        <span className="cap">SOURCE LABELS</span>
        <SourceLabel kind="group" name="חסדי שכונה" color="var(--group-sage)" icon="users" />
        <SourceLabel kind="group" name="בית כנסת רמות" color="var(--group-indigo)" icon="home" />
        <SourceLabel kind="public" />
        <SourceLabel kind="suggested" />
      </div>
      <div className="row" style={{ width: 360 }}>
        <span className="cap">INTERACTION BAR</span>
        <div style={{ width: '100%', border: '1px solid var(--border-subtle)', borderRadius: 'var(--radius-md)', padding: '4px 8px' }}>
          <InteractionBar likes={42} comments={8} liked saved />
        </div>
      </div>
      <div className="row">
        <span className="cap">ICONS · LUCIDE (substitution)</span>
        <div className="icons">{icons.map(n => <Icon key={n} name={n} size={22} />)}</div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
