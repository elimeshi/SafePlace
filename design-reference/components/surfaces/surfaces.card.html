<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-muted); }
  .grid { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
  .col { width: 440px; max-width: 100%; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { PostCard } = window.SafePlaceDesignSystem_58efd0;
function Demo() {
  return (
    <div className="grid">
      <div className="col">
        <PostCard post={{
          author: { name: 'משפחת רוזנברג' }, time: 'לפני שעתיים',
          source: { kind: 'group', name: 'שכונת רמות', color: 'var(--group-indigo)', icon: 'home' },
          body: 'תודה ענקית לכל המתנדבים שהגיעו אתמול לחלוקת החבילות. הקהילה שלנו פשוט מדהימה 💙',
          media: 'https://images.unsplash.com/photo-1526976668912-1a811878dd37?w=800&q=80',
          likes: 42, comments: 8,
        }} />
      </div>
      <div className="col">
        <PostCard filtered post={{
          author: { name: 'דוד' }, time: 'לפני 20 דקות',
          source: { kind: 'public' },
          body: 'שיעור מרתק על פרשת השבוע — מומלץ בחום לכולם.',
          media: 'x', likes: 15, comments: 3,
        }} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
