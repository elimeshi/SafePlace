<!-- @startingPoint section="Screens" subtitle="Full mobile app flow — onboarding, feed, compose" viewport="440x820" -->
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Safe-Place — Mobile</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--surface-muted); min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .phone {
    width: 390px; height: 780px; background: #000; border-radius: 44px; padding: 10px;
    box-shadow: var(--shadow-lg); position: relative;
  }
  .screen { width: 100%; height: 100%; background: var(--white); border-radius: 34px; overflow: hidden; position: relative; }
  .notch { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 130px; height: 26px; background: #000; border-radius: 0 0 16px 16px; z-index: 20; }
  .statusbar { display: flex; justify-content: space-between; align-items: center; padding: 8px 24px 2px; font: var(--type-label); color: var(--ink-900); font-family: var(--font-numeric); }
  .app-root { height: calc(100% - 26px); }
  .sp-iconbtn { background: none; border: none; cursor: pointer; padding: 8px; border-radius: 10px; display: inline-grid; place-items: center; }
  .sp-iconbtn:hover { background: var(--surface-sunken); }
  .sp-hscroll { overflow-x: auto; scrollbar-width: none; }
  .sp-hscroll::-webkit-scrollbar { display: none; }
  .sp-rise { animation: sp-rise-in .45s var(--ease-standard) both; }
  .reset-btn { position: fixed; bottom: 20px; inset-inline-end: 20px; z-index: 50; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border-subtle); background: var(--white); color: var(--text-secondary); font: var(--type-label); cursor: pointer; box-shadow: var(--shadow-sm); }
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="screen">
    <div class="statusbar"><span>9:41</span><span>Safe·Place</span><span>▮▮▮ 100%</span></div>
    <div class="app-root" id="root"></div>
  </div>
</div>
<button class="reset-btn" onclick="localStorage.removeItem('sp_screen');location.reload()">התחל מחדש</button>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="Onboarding.jsx"></script>
<script type="text/babel" src="Feed.jsx"></script>
<script type="text/babel" src="Compose.jsx"></script>
<script type="text/babel">
function App() {
  const [screen, setScreen] = React.useState(() => localStorage.getItem('sp_screen') || 'onboarding');
  React.useEffect(() => { localStorage.setItem('sp_screen', screen); }, [screen]);
  const { SPOnboarding, SPFeed, SPCompose } = window;
  if (screen === 'onboarding') return <SPOnboarding onFinish={() => setScreen('feed')} />;
  if (screen === 'compose') return <SPCompose onClose={() => setScreen('feed')} />;
  return <SPFeed onCreate={() => setScreen('compose')} />;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
