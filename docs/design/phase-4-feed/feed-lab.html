<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Safe·Place — Feed Design Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Assistant:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* ============================ LAB CHROME (LTR) ============================ */
:root{--lab-bg:#0c0e13;--lab-panel:#141821;--lab-panel-2:#1b202b;--lab-line:#262c38;--lab-ink:#e7ebf2;--lab-ink-soft:#8b95a6;--lab-accent:#22c3d6}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--lab-bg);color:var(--lab-ink);font-family:Inter,system-ui,sans-serif;font-size:13px;display:flex;overflow:hidden}
.panel{width:330px;flex:0 0 330px;height:100vh;overflow-y:auto;background:var(--lab-panel);border-inline-end:1px solid var(--lab-line);padding:18px 18px 70px;direction:ltr}
.brand h1{font-size:14px;font-weight:600;margin:0 0 2px}.brand small{color:var(--lab-ink-soft);font-size:11px}
.q{margin-top:18px}
.q .t{display:block;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--lab-ink-soft);font-weight:600;margin-bottom:4px}
.q .why{color:var(--lab-ink-soft);font-size:11px;line-height:1.45;margin:0 0 8px}
.seg{display:flex;background:var(--lab-panel-2);border:1px solid var(--lab-line);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:transparent;color:var(--lab-ink-soft);font-family:inherit;padding:6px 6px;border-radius:6px;cursor:pointer;font-size:11.5px;min-width:60px}
.seg button.active{background:var(--lab-accent);color:#06232a;font-weight:600}
.stage{flex:1;height:100vh;overflow:auto;background:radial-gradient(1200px 600px at 70% -10%,#171c27 0%,transparent 60%),var(--lab-bg)}
.stage-inner{display:flex;align-items:flex-start;justify-content:center;gap:28px;padding:30px 22px 80px;flex-wrap:wrap}
.cell{display:flex;flex-direction:column;align-items:center;gap:10px}
.cell .cap{font-size:12px;color:var(--lab-ink-soft);direction:ltr;max-width:390px;text-align:center}
.cell .cap b{color:var(--lab-ink)}
body.bare{background:#fff}
body.bare .panel{display:none}
body.bare .stage{background:#fff}
body.bare .stage-inner{padding:0;gap:0;justify-content:flex-start}
body.bare .cell .cap{display:none}
body.bare .phone{border-radius:0;padding:0;background:none;box-shadow:none}
body.bare .phone .screen{border-radius:0}

/* ============================ PHONE + TOKENS ============================ */
.phone{
  /* Locked "Indigo Nights" tokens — packages/design-tokens + design-lab/FINAL-SPEC.md */
  --c-primary:#2E3A8C;--c-primary-dark:#1B2352;--c-primary-500:#4451A6;--c-accent:#22C3D6;--c-accent-700:#157C8A;
  --c-bg:#F3F5FC;--c-surface:#FFFFFF;--c-ink:#1A2140;--c-ink-700:#2E3760;--c-ink-soft:#5A6488;--c-ink-mute:#8A93B5;
  --c-border:#DCE1F2;--c-line:#E9ECF7;--c-blue100:#E5E8F7;--c-blue200:#C4CBEC;--c-cyan100:#DBF4F8;
  --c-amber:#F59E0B;--c-slate:#94A3B8;--c-danger:#C53030;--c-rose:#D24D6B;
  --u:9.28px;--r:18px;--r-lg:24px;--r-sm:8px;
  --shadow-soft:0 2px 10px rgba(20,26,60,.07),0 1px 3px rgba(20,26,60,.06);
  --shadow-cta:0 12px 26px -10px rgba(46,58,140,.6);
  --like:var(--c-primary);
  width:390px;flex:0 0 auto;height:844px;border-radius:46px;background:#05070b;padding:11px;position:relative;
  box-shadow:0 40px 90px -30px rgba(0,0,0,.75),0 0 0 1px #1c222d,inset 0 0 0 2px #0b0e14}
.phone .screen{position:relative;height:100%;width:100%;border-radius:36px;overflow:hidden;background:var(--c-bg);direction:rtl;color:var(--c-ink);font-family:Assistant,sans-serif;font-size:16px;display:flex;flex-direction:column}
body.bare .phone{width:390px;height:844px}
.statusbar{position:relative;display:flex;align-items:center;justify-content:space-between;padding:14px 26px 6px;font-size:13px;font-weight:600;color:var(--c-ink);flex:0 0 auto;z-index:6;direction:ltr}
.statusbar.on-dark{color:#fff}
.statusbar .sb-r{display:flex;gap:6px;align-items:center;opacity:.85}
.statusbar .dot{width:16px;height:9px;border-radius:2px;background:currentColor;opacity:.6}
.statusbar .bat{width:22px;height:11px;border:1.5px solid currentColor;border-radius:3px;opacity:.6;position:relative}
.statusbar .bat::after{content:"";position:absolute;inset:1.5px;width:60%;background:currentColor;border-radius:1px}
.scroll{flex:1;overflow:hidden;position:relative}
svg.i{width:22px;height:22px;flex:0 0 auto;display:block}
.disp{font-family:Rubik,sans-serif}

/* ground variants */
.screen.ground-wash{background:linear-gradient(172deg,#DDF1F7 0%,#F3F5FC 26%,#F3F5FC 100%)}

/* app bar */
.appbar{display:flex;align-items:center;justify-content:space-between;padding:4px 18px 8px;flex:0 0 auto}
.wordmark{font-family:Rubik,sans-serif;font-weight:700;font-size:25px;color:var(--c-primary);letter-spacing:-.02em;direction:ltr}
.wordmark .mid{color:var(--c-accent)}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--c-ink-700)}

/* statuses rail */
.stories{display:flex;gap:14px;padding:6px 18px 12px;overflow:hidden}
.story{display:flex;flex-direction:column;align-items:center;gap:6px;width:66px;flex:0 0 66px}
.story .lbl{font-size:12px;font-weight:600;color:var(--c-ink-soft);white-space:nowrap}
.plus-dashed{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:var(--c-surface);border:2px dashed var(--c-blue200);color:var(--c-primary)}
.plus-grad{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#22C3D6 0%,#2E3A8C 60%,#1B2352 100%);color:#fff;box-shadow:var(--shadow-cta)}
.stories-empty{display:flex;align-items:center;font-size:13px;color:var(--c-ink-mute);line-height:1.4;max-width:220px;padding-top:14px}

/* section title */
.sec{display:flex;align-items:baseline;justify-content:space-between;padding:4px 18px 8px}
.sec h3{margin:0;font-family:Rubik,sans-serif;font-weight:600;font-size:15px;color:var(--c-ink)}

/* spaces rail */
.spaces{display:flex;gap:12px;padding:0 18px 16px;overflow:hidden}
.space{width:156px;flex:0 0 156px;border-radius:var(--r);overflow:hidden;background:var(--c-surface);box-shadow:var(--shadow-soft)}
.space .hd{display:flex;align-items:center;gap:7px;padding:9px 11px}
.space .hd svg{width:15px;height:15px}
.space .hd span{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:Rubik,sans-serif}
.space .bd{height:80px;position:relative;overflow:hidden}
.space .bd.text{padding:9px 11px;font-size:13px;line-height:1.45;color:var(--c-ink-700);background:var(--c-bg)}
.space .ft{padding:8px 11px;font-size:11.5px;color:var(--c-ink-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* post card */
.feed{display:flex;flex-direction:column;gap:14px;padding:4px 14px 18px}
.card{background:var(--c-surface);overflow:hidden}
.card.soft{border-radius:var(--r-lg);box-shadow:var(--shadow-soft)}
.card.framed{border-radius:var(--r);border:1px solid var(--c-border);box-shadow:0 1px 2px rgba(20,26,60,.04)}
.ph{display:flex;align-items:flex-start;gap:11px;padding:15px 16px 10px}
.ph .who{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.ph .nm{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.ph .nm b{font-family:Rubik,sans-serif;font-weight:600;font-size:15px;color:var(--c-ink)}
.ph .nm time{font-size:13px;color:var(--c-ink-mute)}
.ph .more{color:var(--c-ink-mute);margin-top:-4px}
.av{border-radius:50%;display:grid;place-items:center;flex:0 0 auto;font-family:Rubik,sans-serif;font-weight:600;color:var(--c-primary);background:var(--c-blue100)}
.av.ring{box-shadow:0 0 0 2.5px var(--c-surface),0 0 0 5px var(--c-accent)}
.body{padding:0 16px 12px;font-size:16px;line-height:1.62;color:var(--c-ink)}
.body .more-link{color:var(--c-primary);font-weight:600}
.loc{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--c-ink-soft);padding:0 16px 10px}
.loc svg{width:15px;height:15px}
.media{position:relative;height:230px;overflow:hidden;background:#cfd6ea}
.media svg.scene{width:100%;height:100%;display:block}
.ibar{display:flex;align-items:center;gap:4px;padding:6px 10px 8px;border-top:1px solid var(--c-line)}
.ibar .act{display:flex;align-items:center;gap:6px;padding:8px 8px;border-radius:12px;color:var(--c-ink-soft);font-size:14px;font-weight:600}
.ibar .act.on{color:var(--like)}
.ibar .sp{flex:1}
.ibar .num{font-variant-numeric:tabular-nums}

/* source labels — 01-feed-spec §4.2: ~20px tall, soft tint, rounded, generous padding */
.lbl{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;align-self:flex-start;white-space:nowrap}
.lbl svg{width:13px;height:13px}

/* filtered / processing placeholders */
.ph-filter{height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:0 30px}
.ph-filter.soft{background:linear-gradient(180deg,#EEF1FA,#E5E8F7)}
.ph-filter.stripes{background:repeating-linear-gradient(135deg,#EEF1FA 0 12px,#E6E9F6 12px 24px)}
.ph-filter b{font-family:Rubik,sans-serif;font-weight:600;font-size:14.5px;color:var(--c-ink-700)}
.ph-filter span{font-size:13px;color:var(--c-ink-soft);line-height:1.45}
.ph-filter .eye{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.75);display:grid;place-items:center;color:var(--c-primary);margin-bottom:2px}
.state-strip{display:flex;align-items:center;gap:8px;padding:10px 14px;font-size:13.5px;line-height:1.45}
.state-strip svg{width:18px;height:18px}
.state-strip.proc{background:var(--c-cyan100);color:var(--c-accent-700)}
.state-strip.review{background:#FBF3E2;color:#8A5A12}
.state-strip.notice{background:var(--c-blue100);color:var(--c-ink-700);align-items:flex-start;flex-direction:column;gap:8px}
.state-strip .acts{display:flex;gap:8px}
.mini{border:0;border-radius:12px;font-family:Rubik,sans-serif;font-weight:600;font-size:13px;padding:7px 12px}
.mini.pri{background:var(--c-primary);color:#fff}
.mini.sec{background:transparent;color:var(--c-primary);border:1.5px solid #9AA4D8}
.mini.ghost{background:transparent;color:var(--c-ink-soft);padding:7px 6px}

/* collapsed strip — 01-feed-spec §6.2: avatars on the right, "tap to expand" centre, chevron left */
.cstrip{display:flex;align-items:center;gap:10px;margin:2px 14px 10px;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.86);box-shadow:var(--shadow-soft);backdrop-filter:blur(8px)}
.cstrip .avs{display:flex}
.cstrip .avs .av{margin-inline-start:-8px;box-shadow:0 0 0 2px #fff}
.cstrip .avs .av:first-child{margin-inline-start:0}
.cstrip .mid{flex:1;text-align:center;font-size:13px;font-weight:600;color:var(--c-ink-soft)}
.cstrip svg{width:18px;height:18px;color:var(--c-ink-soft)}

/* follow rail */
.frail{position:absolute;inset-inline:0;bottom:0;background:rgba(255,255,255,.96);box-shadow:0 -6px 24px -12px rgba(20,26,60,.25);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:12px 0 14px;backdrop-filter:blur(8px)}
.frail .top{display:flex;align-items:center;justify-content:space-between;padding:0 18px 10px}
.frail .top h3{margin:0;font-family:Rubik,sans-serif;font-weight:600;font-size:15px}
.frail .row{display:flex;gap:10px;padding:0 18px;overflow:hidden}
.fcard{width:132px;flex:0 0 132px;border-radius:var(--r);background:var(--c-bg);padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.fcard b{font-family:Rubik,sans-serif;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.fcard .bio{font-size:12px;color:var(--c-ink-soft);line-height:1.35;height:32px;overflow:hidden}
.fcard .cnt{font-size:12px;color:var(--c-ink-mute)}
.fbtn{width:100%;border:0;border-radius:12px;background:var(--c-primary);color:#fff;font-family:Rubik,sans-serif;font-weight:600;font-size:13px;padding:7px 0;margin-top:2px}

/* bottom nav */
.bnav{flex:0 0 auto;display:flex;align-items:center;justify-content:space-around;padding:8px 24px 22px;background:var(--c-surface);border-top:1px solid var(--c-line);z-index:5}
.bnav .tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--c-ink-mute);width:70px}
.bnav .tab.on{color:var(--c-primary)}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(16,26,58,.38);z-index:10}
.sheet{position:absolute;inset-inline:0;bottom:0;background:var(--c-surface);border-radius:var(--r-lg) var(--r-lg) 0 0;z-index:11;padding:8px 0 26px;box-shadow:0 -10px 40px -10px rgba(16,26,58,.35)}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--c-border);margin:2px auto 10px}
.sheet h4{margin:0;padding:4px 20px 10px;font-family:Rubik,sans-serif;font-weight:600;font-size:16px}
.sheet .sub{padding:0 20px 10px;font-size:13.5px;color:var(--c-ink-soft);line-height:1.5}
.srow{display:flex;align-items:center;gap:13px;padding:13px 20px;font-size:15.5px;color:var(--c-ink)}
.srow svg{color:var(--c-primary)}
.srow .tx{flex:1;display:flex;flex-direction:column;gap:2px}
.srow .tx em{font-style:normal;font-size:12.5px;color:var(--c-ink-mute)}
.srow.dis{opacity:.45}
.srow.sel{background:var(--c-bg)}
.sdiv{height:1px;background:var(--c-line);margin:6px 20px}
.sgroup{padding:8px 20px 4px;font-size:11.5px;font-weight:700;color:var(--c-ink-mute);letter-spacing:.04em}
.tg{flex:0 0 auto;width:46px;height:27px;border-radius:999px;background:var(--c-border);position:relative}
.tg.on{background:var(--c-primary)}
.tg::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tg.on::after{inset-inline-start:22px}
.toast{position:absolute;inset-inline:18px;bottom:96px;z-index:12;background:var(--c-primary-dark);color:#fff;border-radius:14px;padding:11px 14px;font-size:14px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-cta)}

/* compose */
.ctop{display:flex;align-items:center;justify-content:space-between;padding:4px 14px 10px;border-bottom:1px solid var(--c-line)}
.ctop .ttl{font-family:Rubik,sans-serif;font-weight:600;font-size:16.5px}
.pub{border:0;border-radius:14px;background:var(--c-primary);color:#fff;font-family:Rubik,sans-serif;font-weight:600;font-size:15px;padding:9px 18px;box-shadow:var(--shadow-cta)}
.pub.dim{opacity:.4;box-shadow:none}
.cid{display:flex;align-items:flex-start;gap:12px;padding:16px 18px 6px}
.cid .who{display:flex;flex-direction:column;gap:6px}
.cid b{font-family:Rubik,sans-serif;font-weight:600;font-size:15.5px}
.expo{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:var(--c-blue100);color:var(--c-primary);font-size:13px;font-weight:700;align-self:flex-start}
.expo svg{width:15px;height:15px}
.expo.locked{background:var(--c-bg);color:var(--c-ink-700);border:1px solid var(--c-border)}
.expo-help{font-size:12px;color:var(--c-ink-mute);line-height:1.4;max-width:260px}
.ctext{padding:10px 18px;font-size:17px;line-height:1.65;color:var(--c-ink);min-height:120px}
.ctext.ph{color:var(--c-ink-mute)}
.cmedia{margin:4px 18px 12px;border-radius:var(--r);overflow:hidden;position:relative;height:190px}
.cmedia .x{position:absolute;top:10px;inset-inline-end:10px;width:30px;height:30px;border-radius:50%;background:rgba(16,26,58,.55);color:#fff;display:grid;place-items:center}
.cmedia .x svg{width:16px;height:16px}
.cmedia .chip{position:absolute;bottom:10px;inset-inline-start:10px;display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.92);color:var(--c-accent-700);font-size:12.5px;font-weight:700}
.cmedia .chip svg{width:14px;height:14px}
.cloc{display:inline-flex;align-items:center;gap:6px;margin:0 18px 10px;height:30px;padding:0 10px 0 12px;border-radius:999px;background:var(--c-bg);border:1px solid var(--c-border);font-size:13px;color:var(--c-ink-700);font-weight:600;align-self:flex-start}
.cloc svg{width:14px;height:14px}
.abar{display:flex;align-items:center;gap:6px;padding:10px 14px 24px;border-top:1px solid var(--c-line);background:var(--c-surface)}
.abtn{display:flex;align-items:center;gap:7px;padding:9px 12px;border-radius:12px;color:var(--c-ink-700);font-size:14px;font-weight:600;background:var(--c-bg)}
.abtn svg{width:19px;height:19px;color:var(--c-primary)}
.notice{margin:6px 18px 12px;border-radius:var(--r);background:var(--c-surface);border:1px solid var(--c-blue200);padding:14px 14px 12px;display:flex;gap:10px;box-shadow:var(--shadow-soft)}
.notice svg{color:var(--c-primary);margin-top:1px}
.notice p{margin:0 0 10px;font-size:14.5px;line-height:1.55;color:var(--c-ink)}
.notice .acts{display:flex;gap:8px;align-items:center}

/* compose on glass variant */
.screen.glassy{background:linear-gradient(145deg,#22C3D6 0%,#2E3A8C 52%,#1B2352 100%)}
.screen.glassy .ctop{border-color:rgba(255,255,255,.18);color:#fff}
.screen.glassy .ctop .iconbtn{color:#fff}
.screen.glassy .pub{background:#fff;color:var(--c-primary)}
.screen.glassy .gcard{margin:8px 14px;border-radius:var(--r-lg);background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);color:#fff;flex:1;display:flex;flex-direction:column;overflow:hidden}
.screen.glassy .cid b{color:#fff}
.screen.glassy .ctext{color:#fff}
.screen.glassy .ctext.ph{color:rgba(255,255,255,.7)}
.screen.glassy .expo{background:rgba(255,255,255,.92)}
.screen.glassy .abar{background:transparent;border-color:rgba(255,255,255,.18)}
.screen.glassy .abtn{background:rgba(255,255,255,.92)}
.screen.glassy .cloc{background:rgba(255,255,255,.92)}

/* single post */
.ptop{display:flex;align-items:center;gap:8px;padding:2px 10px 8px;border-bottom:1px solid var(--c-line);background:var(--c-surface)}
.ptop .ttl{font-family:Rubik,sans-serif;font-weight:600;font-size:16.5px}
.pbar{display:flex;align-items:center;justify-content:space-around;padding:4px 10px;border-top:1px solid var(--c-line);border-bottom:1px solid var(--c-line)}
.pbar .act{display:flex;align-items:center;gap:7px;padding:11px 14px;font-size:15px;font-weight:600;color:var(--c-ink-soft);font-family:Rubik,sans-serif}
.pbar .act.on{color:var(--like)}
.comments{padding:12px 16px 90px;display:flex;flex-direction:column;gap:14px;background:var(--c-surface)}
.cmt{display:flex;gap:9px;align-items:flex-start}
.cmt.l2{margin-inline-start:42px}
.cmt .bub{background:var(--c-bg);border-radius:16px;padding:8px 12px 9px;display:flex;flex-direction:column;gap:2px;max-width:100%}
.cmt .bub b{font-family:Rubik,sans-serif;font-weight:600;font-size:13.5px}
.cmt .bub p{margin:0;font-size:15px;line-height:1.5}
.cmt .bub .at{color:var(--c-primary);font-weight:700}
.cmt .meta{display:flex;gap:14px;font-size:12.5px;color:var(--c-ink-mute);padding:4px 12px 0;font-weight:600}
.cmt .meta .on{color:var(--like)}
.cmt .cmedia-f{margin-top:6px;height:120px;border-radius:12px;overflow:hidden}
.more-cmts{align-self:center;font-size:13.5px;font-weight:700;color:var(--c-primary);padding:6px}
.cbox{position:absolute;inset-inline:0;bottom:0;display:flex;align-items:center;gap:9px;padding:10px 12px 26px;background:var(--c-surface);border-top:1px solid var(--c-line);z-index:5}
.cbox .field{flex:1;height:42px;border-radius:999px;background:var(--c-bg);border:1.5px solid var(--c-border);display:flex;align-items:center;padding:0 14px;font-size:15px;color:var(--c-ink-mute)}
.cbox .send{width:40px;height:40px;border-radius:50%;background:var(--c-primary);color:#fff;display:grid;place-items:center}
.cbox .send svg{width:18px;height:18px}

/* empty / error */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:40px 34px}
.empty .ic{width:64px;height:64px;border-radius:50%;background:var(--c-blue100);display:grid;place-items:center;color:var(--c-primary)}
.empty .ic svg{width:28px;height:28px}
.empty h3{margin:6px 0 0;font-family:Rubik,sans-serif;font-weight:600;font-size:19px}
.empty p{margin:0;font-size:15px;line-height:1.6;color:var(--c-ink-soft)}
.cta{border:0;border-radius:var(--r);background:var(--c-primary);color:#fff;font-family:Rubik,sans-serif;font-weight:600;font-size:16px;padding:14px 26px;box-shadow:var(--shadow-cta);margin-top:8px}
.cta.secondary{background:transparent;color:var(--c-primary);border:1.5px solid #9AA4D8;box-shadow:none}

/* ---- added 2026-10-19: the nine remaining pieces ---- */
/* report sheet */
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--c-border);flex:0 0 auto;display:grid;place-items:center}
.radio.on{border-color:var(--c-primary)}
.radio.on::after{content:"";width:11px;height:11px;border-radius:50%;background:var(--c-primary)}
.tarea{margin:6px 20px 12px;min-height:70px;border-radius:var(--r);border:1.5px solid var(--c-border);background:var(--c-surface);padding:12px 14px;font-size:15px;color:var(--c-ink-mute);line-height:1.5}
.sheet .cta{display:block;width:calc(100% - 40px);margin:4px 20px 0}
/* quote card */
.quote{margin:0 16px 14px;border-radius:var(--r);border:1px solid var(--c-border);background:var(--c-bg);overflow:hidden}
.quote .qh{display:flex;align-items:center;gap:8px;padding:11px 12px 6px}
.quote .qh b{font-family:Rubik,sans-serif;font-weight:600;font-size:13.5px}
.quote .qh time{font-size:12px;color:var(--c-ink-mute)}
.quote .qb{padding:0 12px 10px;font-size:14.5px;line-height:1.55;color:var(--c-ink-700);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.quote .qm{height:120px;overflow:hidden}
.quote.gone{display:flex;align-items:center;gap:8px;padding:14px;font-size:14px;color:var(--c-ink-soft)}
.quote.gone svg{width:18px;height:18px;color:var(--c-ink-mute)}
.shared-by{display:flex;align-items:center;gap:6px;padding:0 16px 8px;font-size:12.5px;color:var(--c-ink-mute);font-weight:600}
.shared-by svg{width:14px;height:14px}
/* exposure: space list */
.sheet .back-row{display:flex;align-items:center;gap:8px;padding:2px 12px 8px}
.sheet .back-row h4{padding:0}
.gico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto}
.gico svg{width:18px;height:18px}
.srow .gico svg{color:inherit}
/* reply mode */
.cmt.hl .bub{box-shadow:0 0 0 2px var(--c-cyan100);background:#EEF8FA}
.replybar{position:absolute;inset-inline:0;bottom:78px;display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--c-bg);border-top:1px solid var(--c-line);font-size:13px;color:var(--c-ink-soft);z-index:5}
.replybar b{color:var(--c-ink-700)}
.cbox .field.active{border-color:var(--c-primary);box-shadow:0 0 0 3px rgba(46,58,140,.14);color:var(--c-ink);gap:6px}
.atchip{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:999px;background:var(--c-blue100);color:var(--c-primary);font-size:13px;font-weight:700}
/* skeleton */
.sk{background:linear-gradient(90deg,#E6E9F5 0%,#EFF1F9 40%,#E6E9F5 80%);background-size:200% 100%;animation:sk 1.4s linear infinite;border-radius:8px}
@keyframes sk{from{background-position:100% 0}to{background-position:-100% 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.skc{background:var(--c-surface);border-radius:var(--r-lg);box-shadow:var(--shadow-soft);padding:15px 16px;display:flex;flex-direction:column;gap:10px}
/* expanded-from-strip panel */
.xpanel{position:absolute;inset-inline:0;top:0;z-index:5;background:var(--c-bg);border-radius:0 0 var(--r-lg) var(--r-lg);box-shadow:0 14px 30px -14px rgba(16,26,58,.35);padding-top:46px}
.xpanel .handle{display:flex;align-items:center;justify-content:center;gap:6px;padding:4px 0 12px;font-size:13px;font-weight:600;color:var(--c-ink-soft)}
.xpanel .handle svg{width:18px;height:18px}
/* motion demo (interactive lab only) */
.mzones{overflow:hidden;transition:max-height 260ms cubic-bezier(.25,.1,.25,1),opacity 220ms cubic-bezier(.25,.1,.25,1);max-height:330px}
.mstrip{transition:opacity 200ms cubic-bezier(.25,.1,.25,1),transform 200ms cubic-bezier(.25,.1,.25,1);opacity:0;transform:translateY(-8px);height:0;overflow:visible}
.mdemo.collapsed .mzones{max-height:0;opacity:0}
.mdemo.collapsed .mstrip{opacity:1;transform:none;height:auto}
.mdemo.collapsed .mfeed{margin-top:0}
@media (prefers-reduced-motion:reduce){.mzones{transition:opacity 200ms}.mstrip{transition:opacity 200ms;transform:none}}
</style>
</head>
<body>
<aside class="panel" id="panel"></aside>
<main class="stage"><div class="stage-inner" id="stage"></div></main>
<script>
/* ============================ ICONS (Lucide, ISC) ============================ */
const G = {
  plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',
  more:'<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
  heart:'<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>',
  comment:'<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
  share:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>',
  bookmark:'<path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2Z"/>',
  down:'<path d="m6 9 6 6 6-6"/>', up:'<path d="m18 15-6-6-6 6"/>',
  back:'<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
  search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  home:'<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',
  user:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.09-3.09a2 2 0 0 0-2.82 0L6 21"/>',
  pin:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',

  eye:'<path d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0"/><circle cx="12" cy="12" r="3"/>',
  x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
  link:'<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
  send:'<path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/>',
  mute:'<path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><line x1="22" x2="16" y1="9" y2="15"/><line x1="16" x2="22" y1="9" y2="15"/>',
  flag:'<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" x2="4" y1="22" y2="15"/>',
  userx:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="17" x2="22" y1="8" y2="13"/><line x1="22" x2="17" y1="8" y2="13"/>',
  help:'<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>',
  globe:'<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>',
  clock:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  thumbdown:'<path d="M17 14V2"/><path d="M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88Z"/>',
  shield:'<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/>',
  refresh:'<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
  wifi:'<path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 4.17-2.65"/><path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/><path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"/><path d="M5 13a10 10 0 0 1 5.24-2.76"/><path d="m2 2 20 20"/>',
  trash:'<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>',
  family:'<path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
};
const ic = (n, o = {}) => `<svg class="i" viewBox="0 0 24 24" fill="${o.fill ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="${o.sw || 2}" stroke-linecap="round" stroke-linejoin="round" style="${o.size ? `width:${o.size}px;height:${o.size}px;` : ''}${o.color ? `color:${o.color};` : ''}">${G[n]}</svg>`;

/* Abstract photo stand-ins — never stock photos (master spec §6.3.5). */
const scene = (k) => {
  const S = {
    street: ['#BFD3EA', '#8FA9CC', '#6E85AC', '#E9D9B8'],
    hills: ['#CFE6EE', '#9CC6B5', '#6FA48F', '#F5E7C8'],
    books: ['#E6E0F2', '#B8AED6', '#7C6A9C', '#F3EBDD'],
    table: ['#F1E4D3', '#D9B996', '#B08968', '#FFF6E8'],
  }[k];
  return `<svg class="scene" viewBox="0 0 390 230" preserveAspectRatio="xMidYMid slice"><rect width="390" height="230" fill="${S[0]}"/><circle cx="300" cy="60" r="26" fill="${S[3]}" opacity=".9"/><path d="M0 170 Q90 110 180 150 T390 130 V230 H0Z" fill="${S[1]}"/><path d="M0 200 Q120 150 240 185 T390 175 V230 H0Z" fill="${S[2]}"/></svg>`;
};

const av = (name, size = 42, extra = '') => `<span class="av ${extra}" style="width:${size}px;height:${size}px;font-size:${Math.round(size * 0.42)}px">${name.trim()[0]}</span>`;

/* ============================ VARIANTS (the open questions) ============================ */
const Q = [
  { k: 'nav', t: 'Q1 · Main navigation bar', why: 'Search spec §2.1 and personal-area spec §1.3 refer to a "main navigation bar" with Search and Profile, but no spec defines it. Phase 4 builds only the feed; unbuilt tabs would open a "coming soon" placeholder.', opts: [['tabs', 'Bottom tabs (Home / Search / Profile)'], ['none', 'No nav in Phase 4']] },
  { k: 'card', t: 'Q2 · Post card style', why: 'Feed spec §4: "white background, subtle frame, space to the next card". The onboarding cards are radius 24, shadow-only.', opts: [['soft', 'Soft (r24, shadow)'], ['framed', 'Framed (r18, 1px border)']] },
  { k: 'like', t: 'Q3 · Active like colour', why: 'Old kit used red. The locked palette has no red except danger.', opts: [['primary', 'Indigo'], ['accent', 'Cyan'], ['rose', 'Soft rose']] },
  { k: 'shd', t: 'Q4 · Space-card header', why: 'Feed spec §2.2.1: header "on a background in the group colour". Source labels (§4.2) are a soft tint.', opts: [['solid', 'Solid group colour'], ['tint', 'Soft tint']] },
  { k: 'fam', t: 'Q5 · Family Space card identity', why: 'Family spaces have no colour or icon in the schema (only groups do, §2.2.4).', opts: [['indigo', 'Primary indigo + house'], ['grad', 'Brand gradient + house'], ['neutral', 'Neutral grey + house']] },
  { k: 'plus', t: 'Q6 · The "+" circle in the statuses rail', why: 'Feed spec §2.1.1: a dedicated circle with a plus, first in the rail.', opts: [['dashed', 'Dashed outline'], ['grad', 'Brand gradient fill']] },
  { k: 'ground', t: 'Q7 · Feed background', why: 'Onboarding Welcome uses the light "Dual" wash; feeds usually sit on flat ground.', opts: [['flat', 'Flat #F3F5FC'], ['wash', 'Faint cyan wash at top']] },
  { k: 'compose', t: 'Q8 · Compose screen ground', why: 'Sign-up uses full-bleed gradient + glass. Compose is a working screen.', opts: [['white', 'White sheet'], ['glass', 'Full-bleed + glass']] },
  { k: 'filter', t: 'Q9 · Filtered-media placeholder', why: 'Old design system used diagonal stripes + eye. Text stays visible either way.', opts: [['soft', 'Soft indigo panel'], ['stripes', 'Diagonal stripes']] },
];
const params = new URLSearchParams(location.search);
// LOCKED by Eli 2026-10-19 — these are the shipped choices; the other options stay viewable for reference only.
const LOCKED = { nav: 'tabs', card: 'soft', like: 'primary', shd: 'solid', fam: 'grad', plus: 'grad', ground: 'flat', compose: 'white', filter: 'soft' };
const V = Object.fromEntries(Q.map(q => [q.k, params.get(q.k) || LOCKED[q.k]]));

function renderPanel() {
  const p = document.getElementById('panel');
  p.innerHTML = `<div class="brand"><h1>Safe·Place — Feed design lab</h1><small>Phase 4 · feed / compose / single post · locked "Indigo Nights" tokens</small></div>` +
    Q.map(q => `<div class="q"><span class="t">${q.t}</span><p class="why">${q.why}</p><div class="seg">${q.opts.map(([v, l]) => `<button class="${V[q.k] === v ? 'active' : ''}" onclick="setV('${q.k}','${v}')">${l}</button>`).join('')}</div></div>`).join('');
}
function setV(k, v) { V[k] = v; const u = new URL(location); u.searchParams.set(k, v); history.replaceState(null, '', u); renderAll(); }

/* ============================ SHARED PIECES ============================ */
const GROUP = { ramot: { name: 'שכונת רמות', color: '#2E3A8C', icon: 'home' }, sfarim: { name: 'גמ״ח ספרים', color: '#5B8C5A', icon: 'users' } };
const statusbar = (dark) => `<div class="statusbar ${dark ? 'on-dark' : ''}"><span>9:41</span><span class="sb-r"><i class="dot"></i><i class="bat"></i></span></div>`;
const tint = (hex, a) => { const n = parseInt(hex.slice(1), 16); const r = n >> 16, g = (n >> 8) & 255, b = n & 255; const m = (c) => Math.round(c * a + 255 * (1 - a)); return `rgb(${m(r)},${m(g)},${m(b)})`; };

function sourceLabel(src) {
  if (src.kind === 'group') return `<span class="lbl" style="background:${tint(src.color, .14)};color:${src.color}">${ic(src.icon)}${src.name}</span>`;
  if (src.kind === 'public') return `<span class="lbl" style="background:#EEF1F6;color:#5B6B85">פוסט ציבורי</span>`;
  if (src.kind === 'followers') return `<span class="lbl" style="background:#EEF1F6;color:#5B6B85">לעוקבים</span>`;
  if (src.kind === 'suggested') return `<span class="lbl" style="background:#FEF3DC;color:#A8650A">מוצע עבורך</span>`;
  return '';
}
function filteredPh(h = 200) {
  return `<div class="ph-filter ${V.filter}" style="height:${h}px"><span class="eye">${ic('eye', { size: 20 })}</span><b>מדיה מסוננת לפי ההעדפות שלך</b><span>ניתן לשנות את העדפות הצריכה באזור האישי בכל עת.</span></div>`;
}
function ibar(p) {
  return `<div class="ibar"><span class="act ${p.liked ? 'on' : ''}">${ic('heart', { fill: p.liked })}<span class="num">${p.likes}</span></span><span class="act">${ic('comment')}<span class="num">${p.comments}</span></span><span class="act">${ic('share')}</span><span class="sp"></span><span class="act">${ic('bookmark', { fill: p.saved })}</span></div>`;
}
function card(p) {
  let media = '';
  if (p.media === 'filtered') media = filteredPh();
  else if (p.media) media = `<div class="media">${scene(p.media)}</div>`;
  const strip = p.state === 'processing' ? `<div class="state-strip proc">${ic('clock')}המדיה בעיבוד ותוצג בקרוב.</div>` : '';
  return `<article class="card ${V.card}">
    <div class="ph">${av(p.author, 42)}<div class="who"><div class="nm"><b>${p.author}</b><time>${p.time}</time></div>${sourceLabel(p.source)}</div><span class="more">${ic('more')}</span></div>
    ${p.body ? `<div class="body">${p.body}</div>` : ''}
    ${p.loc ? `<span class="loc">${ic('pin')}${p.loc}</span>` : ''}
    ${media}${strip}
    ${ibar(p)}
  </article>`;
}
const POSTS = [
  { author: 'משה רוזנברג', time: 'לפני שעתיים', source: { kind: 'group', ...GROUP.ramot }, body: 'תודה ענקית לכל המתנדבים שהגיעו אתמול לחלוקת החבילות לקראת החג. הקהילה שלנו פשוט מדהימה 💙', media: 'street', likes: 42, comments: 8, liked: true },
  { author: 'הרב אליהו כהן', time: 'לפני 4 שעות', source: { kind: 'public' }, body: 'מחשבה קצרה לפרשת השבוע: לפעמים הדבר הגדול ביותר שאפשר לתת לזולת הוא פשוט להקשיב. שבת שלום לכולם.', likes: 128, comments: 23 },
  { author: 'יעקב פרידמן', time: 'לפני 6 שעות', source: { kind: 'suggested' }, body: 'נפתח מסלול הליכה חדש בפארק השכונתי — מומלץ לבוא בשעות הבוקר.', media: 'filtered', likes: 15, comments: 3 },
  { author: 'דוד לוינסון', time: 'אתמול', source: { kind: 'followers' }, body: 'הספרייה הביתית סוף סוף מסודרת. מי שצריך ספר — מוזמן לבקש.', media: 'books', likes: 9, comments: 2, saved: true },
  { author: 'אבי מזרחי', time: 'עכשיו', source: { kind: 'public' }, body: 'בוקר טוב מהטיול המשפחתי 🙏', media: 'hills', state: 'processing', likes: 0, comments: 0, loc: 'נחל שורק' },
];

function bnav() {
  if (V.nav !== 'tabs') return '';
  return `<nav class="bnav"><span class="tab on">${ic('home', { sw: 2.4 })}בית</span><span class="tab">${ic('search')}חיפוש</span><span class="tab">${ic('user')}פרופיל</span></nav>`;
}
function screen(inner, cls = '') { return `<div class="screen ${cls}">${inner}</div>`; }
function feedGround() { return V.ground === 'wash' ? 'ground-wash' : ''; }

function spaceCard(s) {
  let hd;
  if (s.fam) {
    const bg = V.fam === 'grad' ? 'linear-gradient(145deg,#22C3D6,#2E3A8C 70%)' : V.fam === 'neutral' ? '#E9ECF7' : '#2E3A8C';
    const fg = V.fam === 'neutral' ? '#2E3760' : '#fff';
    hd = `<div class="hd" style="background:${bg};color:${fg}">${ic('family')}<span>${s.name}</span></div>`;

  const bd = s.media ? `<div class="bd">${scene(s.media)}</div>` : `<div class="bd text">${s.text}</div>`;
  return `<div class="space">${hd}${bd}<div class="ft">${s.last} · ${s.time}</div></div>`;

    : `<div class="quote"><div class="qh">${av('הרב אליהו כהן', 26)}<b>הרב אליהו כהן</b><time>אתמול</time></div><div class="qb">מחשבה קצרה לפרשת השבוע: לפעמים הדבר הגדול ביותר שאפשר לתת לזולת הוא פשוט להקשיב. שבת שלום לכולם.</div></div>`;
  return `<article class="card ${V.card}">
    <div class="ph">${av('אבי מזרחי', 42)}<div class="who"><div class="nm"><b>אבי מזרחי</b><time>לפני 20 דק׳</time></div>${sourceLabel({ kind: 'group', ...GROUP.ramot })}</div><span class="more">${ic('more')}</span></div>
    <div class="shared-by">${ic('share')}שיתף פוסט</div>
    <div class="body">${gone ? 'שווה לקרוא 👇' : 'מילים כל כך נכונות, שווה לקרוא 👇'}</div>
    ${inner}${ibar({ likes: 4, comments: 0 })}</article>`;
}

function renderAll() {
  document.querySelectorAll('.phone').forEach(() => {});
  const likeColor = { primary: '#2E3A8C', accent: '#1AA6B8', rose: '#D24D6B' }[V.like];
  const only = params.get('screen');
  const list = only ? [only] : ORDER;
  document.getElementById('stage').innerHTML = list.map(k => `<div class="cell"><div class="phone" style="--like:${likeColor}">${SCREENS[k].html()}</div><div class="cap">${SCREENS[k].cap}</div></div>`).join('');
  if (!params.has('bare')) renderPanel();
}
